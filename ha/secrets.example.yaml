# Keys the HAku packages read with !secret. Merge them into Home Assistant's own
# secrets.yaml on mserver (/root/docker/homeassistantV3/config/secrets.yaml); never
# commit the real values (a filled-in copy may live in the gitignored
# ha/secrets.private.yaml).

# housewall.yaml: one Roku ECP /input URL per wall Roku. The template is rendered by
# rest_command, so keep the literal {{ payload }}.
haku_roku_living_input: "http://192.0.2.51:8060/input?{{ payload }}"
haku_roku_kids_input: "http://192.0.2.52:8060/input?{{ payload }}"
haku_roku_bedroom_input: "http://192.0.2.53:8060/input?{{ payload }}"
haku_roku_den_input: "http://192.0.2.54:8060/input?{{ payload }}"
haku_roku_office_input: "http://192.0.2.55:8060/input?{{ payload }}"
haku_roku_dad_input: "http://192.0.2.56:8060/input?{{ payload }}"
haku_roku_dad_active_app: "http://192.0.2.56:8060/query/active-app"
haku_roku_dad_launch: "http://192.0.2.56:8060/launch/dev"

# cameras_front.yaml: the front camera's ONVIF PTZ endpoint (RTSP URLs are
# genbolt_fixed_stream / genbolt_ptz_stream, already in secrets.yaml).
genbolt_onvif_ptz_url: "http://192.0.2.31:8080/onvif/ptz_service"

# water_meter_health.yaml: the notify action for alerts to the owner's phone.
haku_owner_notify: notify.mobile_app_phone

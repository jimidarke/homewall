# Every suite that runs without a Roku, a tablet or the house's network.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sidecar:
    name: Sidecar + stream (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the sidecar's Dockerfile base
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      - run: pip install -r sidecar/requirements.txt pytest
      - name: Sidecar (incl. the Roku golden files) and the discovery service
        run: python -m pytest sidecar/tests stream/tests -q
      - name: Credential redaction used by tools/baseline.sh
        run: bash tools/tests/test_redact.sh

  roku:
    name: Roku channel (lint, unit, contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roku/package-lock.json
      - run: npm ci
      # HAKU_FIXTURE=1: the contract tests read tests/fixtures/ instead of the live servers.
      - run: npm test
        env:
          HAKU_FIXTURE: "1"

  tablet:
    name: Fire tablet (unit tests, debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fire-tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The runner image ships the Android SDK (ANDROID_HOME); with no local.properties the
      # build uses a placeholder sidecar address, which the unit tests don't contact.
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

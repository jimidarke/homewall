# go2rtc — HAku capture pipeline (nserver, 192.0.2.20)
#
# Source:    Macrosilicon USB3.0 HDMI capture (/dev/v4l/by-id/...) fed from NVR HDMI-out (4-up mosaic)
# Encoder:   Intel Quick Sync (Iris Plus G1, Ice Lake) via h264_qsv
# Replaces:  legacy sendHDMI.service / mjpg_streamer @ :8090
#
# Endpoints (LAN, served on enp1s0 IP 192.0.2.20):
#   RTSP        rtsp://192.0.2.20:8554/mosaic
#   HLS shallow http://192.0.2.20:1984/api/stream.m3u8?src=mosaic   (go2rtc native, ~1s buffer)
#   HLS (Roku)  http://192.0.2.20:1985/hls/mosaic.m3u8              (haku-hls.service, 3 × 2s window — Roku consumers use this)
#   MJPEG       http://192.0.2.20:1984/api/stream.mjpeg?src=mosaic
#   WebRTC      via http://192.0.2.20:1984/stream.html?src=mosaic
#   JPEG snap   http://192.0.2.20:1984/api/frame.jpeg?src=mosaic
#   Status UI   http://192.0.2.20:1984/

api:
  listen: ":1984"
  origin: "*"        # CORS-open: HA / Roku / browsers / phone all pull cross-origin

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

ffmpeg:
  bin: /usr/bin/ffmpeg

streams:
  mosaic:
    # Capture native MJPEG from the Macrosilicon UVC device, encode H.264 via Intel Quick Sync.
    #
    # Capture device negotiates 20 fps with NVR HDMI-out and ignores any
    # lower -framerate hint, so we plan around 20 fps actual.
    #
    # Encode params chosen for universal Roku decode + browser/HA compatibility:
    #   - main profile, level 4.0  → universal H.264 hardware-decode path (every Roku since 2008)
    #   - pix_fmt yuv420p          → universal browser/Roku decode
    #   - GOP 40 (= 2s @ 20 fps)   → HLS-segment-aligned 2-sec keyframes
    #   - bf 0, look_ahead 0       → minimum encoder latency
    #   - 2.5 Mbps CBR / 3.0 cap   → NVR mosaic with 4 quadrants of motion fits comfortably
    #   - no audio (NVR HDMI carries none)
    - >-
      exec:ffmpeg
      -hide_banner -loglevel warning
      -f v4l2 -input_format mjpeg -video_size 1920x1080 -framerate 20
      -i /dev/v4l/by-id/usb-MACROSILICON_USB3.0_Video_67807015-video-index0
      -init_hw_device qsv=qsv:/dev/dri/renderD128
      -filter_hw_device qsv
      -vf "format=nv12,hwupload=extra_hw_frames=64"
      -c:v h264_qsv
      -preset veryfast
      -profile:v main -level:v 4.0
      -look_ahead 0 -bf 0 -g 40 -keyint_min 40
      -b:v 2500k -maxrate 3000k -bufsize 5000k -rc_mode CBR
      -an
      -f rtsp {output}

  # ----- Per-cam streams (credentials via EnvironmentFile) -----
  # Camera mapping:
  #   front        192.0.2.31  Genbolt dual-lens, PTZ lens (/21, mounted sideways), front walk
  #   front_steps  192.0.2.31  Genbolt dual-lens, fixed lens (/11), the front steps
  #   yard      192.0.2.32  Reolink, PTZ, full back yard / drive pad / fence
  #   side      192.0.2.33  Amcrest, PTZ, side gate
  #   backyard  192.0.2.34  Reolink-family, no PTZ, playground behind garage
  #
  # Reolink @ .32 main stream is HEVC 4K — Roku Video node won't decode HEVC over
  # HLS reliably, so we use the H.264 sub-stream (h264Preview_01_sub, ~640x480).
  # If/when we want full-res, transcode via QSV like the mosaic.
  # Reolink @ .34 main stream is already H.264 1536x2048 — use it directly.
  #
  # Creds come from /etc/haku/cam-creds.env via the systemd unit:
  #   HAKU_CAM_USER=admin
  #   HAKU_CAM_PASSWORD=<...>
  #   HAKU_FRONT_USER=<...>       the Genbolt has its own login (HA keeps it as genbolt_ptz_stream)
  #   HAKU_FRONT_PASSWORD=<...>
  # go2rtc supports ${VAR} substitution in stream URLs.
  #
  # front: the Genbolt's PTZ lens (/21) is HEVC Main 1920x1080 @ 15 fps, which the
  # Express and Stick Rokus can't decode, so it's transcoded via Quick Sync like the mosaic:
  # QSV HEVC decode -> vpp_qsv scale to 1280x720 (also feeds the full-screen takeover) ->
  # h264_qsv main, GOP 30 (= 2 s @ 15 fps, HLS-segment-aligned), ~2 Mbps CBR, no audio.
  # It reads the camera directly: an intermediate raw stream would show up in discovery.
  front:
    - >-
      exec:ffmpeg
      -hide_banner -loglevel warning
      -rtsp_transport tcp
      -hwaccel qsv -hwaccel_output_format qsv -c:v hevc_qsv
      -i rtsp://${HAKU_FRONT_USER}:${HAKU_FRONT_PASSWORD}@192.0.2.31:554/21
      -vf "vpp_qsv=w=1280:h=720"
      -c:v h264_qsv
      -preset veryfast
      -profile:v main -level:v 4.0
      -look_ahead 0 -bf 0 -g 30 -keyint_min 30
      -b:v 2000k -maxrate 2500k -bufsize 4000k
      -an
      -f rtsp {output}
  # front_steps: the Genbolt's fixed lens (/11, HEVC Main 1920x1080 @ 15 fps) looks down
  # at the front steps, which the sideways PTZ can't see. Same transcode as `front`. The
  # Rokus switch their home square to it on HA's `homeCam=front_steps` push (front motion),
  # so haku-hls@front_steps keeps it running and a switch never waits for a cold start.
  front_steps:
    - >-
      exec:ffmpeg
      -hide_banner -loglevel warning
      -rtsp_transport tcp
      -hwaccel qsv -hwaccel_output_format qsv -c:v hevc_qsv
      -i rtsp://${HAKU_FRONT_USER}:${HAKU_FRONT_PASSWORD}@192.0.2.31:554/11
      -vf "vpp_qsv=w=1280:h=720"
      -c:v h264_qsv
      -preset veryfast
      -profile:v main -level:v 4.0
      -look_ahead 0 -bf 0 -g 30 -keyint_min 30
      -b:v 2000k -maxrate 2500k -bufsize 4000k
      -an
      -f rtsp {output}
  yard:
    - rtsp://${HAKU_CAM_USER}:${HAKU_CAM_PASSWORD}@192.0.2.32:554/h264Preview_01_sub
  side:
    - rtsp://${HAKU_CAM_USER}:${HAKU_CAM_PASSWORD}@192.0.2.33:554/cam/realmonitor?channel=1&subtype=0
  # disabled 2026-10-24: camera .34 offline (RTSP closed, NVR cannot reach it). Re-enable here,
  # deploy, then `systemctl enable --now haku-hls@backyard` and add it back to the dashboard streams.
#  backyard:
#    - rtsp://${HAKU_CAM_USER}:${HAKU_CAM_PASSWORD}@192.0.2.34:554/h264Preview_01_main

log:
  level: info
  output: stderr

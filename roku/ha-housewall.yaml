# HAku push package (HA -> Roku over ECP)
#
# Live copy: mserver /root/docker/homeassistantV3/config/ha/packages/housewall.yaml.
# This file is a byte-for-byte copy; change it here and deploy as described in
# roku/CLAUDE.md "HA push side". What HA may send: docs/HAKU_DESIGN.md
# "Overlay layer" and "Event-driven flows".
#
# Entities, scripts and automations are named housewall_* / "HouseWall" because
# the package predates the HAku name.
#
# How a push reaches a Roku: a rest_command POSTs to the Roku's ECP
# http://<roku>:8060/input?<payload>. The running HAku channel gets it as a
# roInputEvent and MainScene.dispatchEcp routes it:
#   homeCam=<cam>|default         point the home camera square at a stream, or back
#   cam=<cam>&severity=high|normal full-screen live camera + toast (replay= seeks back)
#   cam=<cam>&severity=low        PIP overlay, no route change
#   lastMotion=<cam>&lastMotionAt=<unix>   "motion N min ago" label on the live HUD
#
# Contents:
#   rest_command.housewall_<room>     one per Roku (living .51, kids .52,
#                                     bedroom .53, den .54, office .55)
#   sensor.housewall_active_service   which Roku to target, from sensor.jimi_phone_room
#   script.housewall_broadcast        the same payload to all five Rokus
#   automations                       front steps view, front door opened,
#                                     after-hours back motion / back door,
#                                     motion-timestamp heartbeat, office
#                                     relaunch (Roku home screen → HAku)
#
# Sensors used: binary_sensor.front_motion_occupancy, binary_sensor.front_doorcontact_contact,
# binary_sensor.back_doorcontact_contact, binary_sensor.backyard_motion_occupancy,
# sensor.jimi_phone_room (ESPresense).

#-------------------------------------------------------------------------------
# REST COMMANDS — one per Roku. (configuration.yaml declares no rest_command;
# this package does.)
#-------------------------------------------------------------------------------
# Roku ECP /input reads only the URL's query string and ignores a POST body, so the
# payload (already form-encoded, e.g. "cam=front&severity=normal") goes in the URL.
rest_command:
  housewall_living:
    url: "http://192.0.2.51:8060/input?{{ payload }}"
    method: POST
    timeout: 5
  housewall_kids:
    url: "http://192.0.2.52:8060/input?{{ payload }}"
    method: POST
    timeout: 5
  housewall_bedroom:
    url: "http://192.0.2.53:8060/input?{{ payload }}"
    method: POST
    timeout: 5
  housewall_den:
    url: "http://192.0.2.54:8060/input?{{ payload }}"
    method: POST
    timeout: 5
  # Office Roku (the dev Roku, also a wall). Reached by the broadcast script and
  # the front-door automation; the active-Roku selector never picks it.
  housewall_office:
    url: "http://192.0.2.55:8060/input?{{ payload }}"
    method: POST
    timeout: 5

#-------------------------------------------------------------------------------
# ACTIVE-ROKU SELECTOR — the rest_command for the Roku in the room ESPresense
# puts Jimi's phone in. Anything else (unknown, offline, a room without a mapped
# Roku) falls through to housewall_living.
#-------------------------------------------------------------------------------
template:
  - sensor:
      - name: "HouseWall active service"
        unique_id: housewall_active_service
        state: >-
          {% set room = states('sensor.jimi_phone_room') %}
          {% if room == 'bedroom' %}rest_command.housewall_bedroom
          {% elif room == 'den' %}rest_command.housewall_den
          {% elif room in ['kitchen','living','living_room'] %}rest_command.housewall_living
          {% else %}rest_command.housewall_living
          {% endif %}

#-------------------------------------------------------------------------------
# BROADCAST SCRIPT — send one payload to all five Rokus in parallel.
# Used by the front steps view and the motion-timestamp heartbeat.
#-------------------------------------------------------------------------------
script:
  housewall_broadcast:
    alias: HouseWall broadcast
    description: Fan a payload to all 5 HAku Rokus in parallel.
    # queued: two automations can broadcast in the same instant (the motion-
    # timestamp heartbeat and the front steps revert both fire when motion clears).
    # single mode would drop the second call, and parallel lets two POSTs hit one
    # Roku at once, where ECP may hand the channel one request's params twice and
    # lose the other's. Queued runs them back to back, each still fanned out.
    mode: queued
    fields:
      payload:
        description: form-urlencoded payload for the Roku /input endpoint
        example: "lastMotion=front&lastMotionAt=1715200000"
    sequence:
      - parallel:
          - service: rest_command.housewall_living
            continue_on_error: true
            data:
              payload: "{{ payload }}"
          - service: rest_command.housewall_kids
            continue_on_error: true
            data:
              payload: "{{ payload }}"
          - service: rest_command.housewall_bedroom
            continue_on_error: true
            data:
              payload: "{{ payload }}"
          - service: rest_command.housewall_den
            continue_on_error: true
            data:
              payload: "{{ payload }}"
          - service: rest_command.housewall_office
            continue_on_error: true
            data:
              payload: "{{ payload }}"

#-------------------------------------------------------------------------------
# AUTOMATIONS
#-------------------------------------------------------------------------------
automation:

  # --- Front steps view (broadcast) -------------------------------------------
  # Front motion that lasts 5 s points every wall's camera square at the Genbolt's
  # fixed lens on the steps (stream front_steps); the PTZ (front) is mounted
  # sideways and can't see them. The sensor holds "on" for 90 s after the last
  # movement, so clearing is the revert. The Rokus also revert by themselves after
  # 15 min if the revert is missed.
  - alias: "HouseWall · Front steps view"
    id: housewall_front_steps_view
    description: >-
      Front motion on for 5 s → every Roku's home camera square shows the front
      steps (homeCam=front_steps); motion clears, the sensor goes unavailable or
      HA starts → back to the PTZ (homeCam=default). No route change, no toast.
    mode: queued
    trigger:
      - platform: state
        entity_id: binary_sensor.front_motion_occupancy
        to: "on"
        for: "00:00:05"
        id: steps
      - platform: state
        entity_id: binary_sensor.front_motion_occupancy
        to: ["off", "unavailable", "unknown"]
        id: ptz
      - platform: homeassistant
        event: start
        id: ptz
    action:
      - service: script.housewall_broadcast
        data:
          payload: >-
            {{ 'homeCam=front_steps' if trigger.id == 'steps' else 'homeCam=default' }}

  # --- Front door opened (office Roku only) -----------------------------------
  - alias: "HouseWall · Front door opened"
    id: housewall_front_door_opened
    description: >-
      Front door contact opens → the office Roku goes full-screen on the
      fixed lens over the front steps (front_steps) for 60 s. The kitchen
      tablet shows the same camera for the same minute via the sidecar.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.front_doorcontact_contact
        to: "on"
    action:
      - service: rest_command.housewall_office
        data:
          payload: "cam=front_steps&severity=normal&reason=opened&banner=Front+Door+opened"

  # --- After hours (22:00–06:00): back of house, high severity, active Roku ---
  - alias: "HouseWall · After-hours back motion"
    id: housewall_after_hours_back_motion
    description: >-
      Backyard motion between 22:00–06:00 is a high-severity event:
      unconditional cam swap to backyard with 15 s replay, coral-bordered
      "ATTN" toast. Either the primary backyard sensor or the secondary
      back_yard motion sensor triggers this.
    mode: single
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.backyard_motion_occupancy
          # binary_sensor.backyard_corner_motion_occupancy is unavailable; add it
          # back here when it returns.
        to: "on"
    condition:
      - condition: time
        after: "22:00:00"
        before: "06:00:00"
    action:
      - service: "{{ states('sensor.housewall_active_service') }}"
        data:
          payload: "cam=backyard&severity=high&replay=15&reason=after+hours+motion&banner=ATTN+Backyard"

  - alias: "HouseWall · After-hours back door"
    id: housewall_after_hours_back_door
    description: >-
      Back door opening between 22:00–06:00 is the highest-priority event —
      somebody just came in or out the back. High severity + 15 s replay.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.back_doorcontact_contact
        to: "on"
    condition:
      - condition: time
        after: "22:00:00"
        before: "06:00:00"
    action:
      - service: "{{ states('sensor.housewall_active_service') }}"
        data:
          payload: "cam=backyard&severity=high&replay=15&reason=after+hours+door&banner=ATTN+Back+Door"

  # --- Motion-timestamp heartbeat (broadcast) ---------------------------------
  # When a tracked motion sensor clears, push lastMotion=<cam>&lastMotionAt=<unix>
  # so the live view's "motion N min ago" label stays current without the Roku
  # polling HA.
  - alias: "HouseWall · Push motion timestamps"
    id: housewall_push_motion_timestamps
    description: >-
      Fires when any tracked motion sensor returns to off. Sends a
      lastMotion=<cam>&lastMotionAt=<unix> payload that LiveGroup.refreshMotionLabel
      consumes for the right-edge HUD timestamp.
    mode: queued
    max: 8
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.front_motion_occupancy
          - binary_sensor.backyard_motion_occupancy
          # binary_sensor.backyard_corner_motion_occupancy is unavailable; add it
          # back here when it returns.
        to: "off"
    action:
      - service: script.housewall_broadcast
        data:
          # Map HA entity_id → Roku cam id. Only front and backyard have
          # motion sensors; side and yard have none.
          payload: >-
            {%- set raw = trigger.entity_id | replace('binary_sensor.','') -%}
            {%- if raw == 'front_motion_occupancy' -%}
              {%- set cam = 'front' -%}
            {%- else -%}
              {%- set cam = 'backyard' -%}
            {%- endif -%}
            lastMotion={{ cam }}&lastMotionAt={{ as_timestamp(now()) | int }}

  # --- Office relaunch ---------------------------------------------------------
  # The office Roku drops to the Roku home screen now and then (a stray Back or
  # Home press, or the OS). Every 5 min, if it's sitting on the home screen
  # (app 562859, screensaver or not), launch HAku. Any other app, HAku included,
  # is left alone. HA's state can't tell home from an app: it reads "idle" for
  # any screensaver and "on" for the "Roku Dynamic Menu" home app.
  - alias: "HouseWall · Office relaunch"
    id: housewall_office_relaunch
    description: >-
      Every 5 min: office Roku on the Roku home screen → launch HAku
      (media_player.select_source). Netflix, HAku or any other app: no-op.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: "{{ state_attr('media_player.office_office', 'app_id') == '562859' }}"
    action:
      - service: media_player.select_source
        target:
          entity_id: media_player.office_office
        data:
          source: HAku
